name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openlab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: openlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openlab"
          --health-interval 5s
          --health-retries 10
    env:
      # CI-only throwaway values; real secrets live in each installation's .env.
      DATABASE_URL: postgresql://openlab:ci-only-password@localhost:5432/openlab
      AUTH_SECRET: ci-only-auth-secret-not-used-in-production
      OPENLAB_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEED_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    # Verifies every Dockerfile target builds (images are not pushed).
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [web, worker, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
